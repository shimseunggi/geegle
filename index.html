<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>기글 (Geegle) - 조선의 검색 엔진</title>
    <style>
        body {
            margin: 0; min-height: 100vh; background-color: #f0f0f0;
            cursor: none; 
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Gungsuh', serif;
            overflow-x: hidden;
            touch-action: none; 
        }

        /* 로고 */
        .geegle-logo-container {
            display: flex; justify-content: center; align-items: center;
            margin-top: 5vh; margin-bottom: 8vh; /* 말풍선 공간 확보를 위해 여백 증가 */
            z-index: 10;
            width: 100%; 
        }
        .geegle-logo-img {
            max-width: 80%; width: 400px; height: auto; display: block; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1));
        }

        /* 레이아웃 */
        .layout-row { 
            display: flex; flex-direction: row; gap: 80px; 
            align-items: flex-end; justify-content: center;
            margin-bottom: 30px; flex-wrap: wrap; 
        }
        .item-wrapper {
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.3s ease;
            position: relative;
        }

        /* 반응형 */
        @media (max-width: 1000px) { .layout-row { gap: 40px; } }
        @media (max-width: 768px) {
            .layout-row { flex-direction: column; align-items: center; gap: 150px; } /* 모바일 간격 확보 */
            .item-wrapper { transform: scale(0.9); }
        }

        /* 화로 디자인 */
        #fire-pit-container {
            position: relative; width: 300px; height: 300px;
            display: flex; justify-content: center; align-items: center;
        }
        .earthen-pot {
            position: absolute; bottom: 0; width: 280px; height: 180px;
            background: radial-gradient(circle at 30% 30%, #5d4037, #3e2723);
            border-radius: 0 0 140px 140px; border-top: 10px solid #2d1e19; 
            box-shadow: inset 10px -10px 20px rgba(0,0,0,0.6), 0 20px 30px rgba(0,0,0,0.4); z-index: 1;
        }
        .pot-rim {
            position: absolute; top: 60px; width: 280px; height: 100px;
            background: #1a0500; border-radius: 50%; border: 15px solid #4e342e;
            border-bottom-color: #2d1e19; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            box-sizing: border-box; z-index: 2; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        .coal { 
            position: absolute; background: #1a1a1a; box-shadow: inset 0 0 15px #8b0000; 
            animation: glow 2s infinite alternate ease-in-out; border-radius: 40% 60% 50% 50%;
        }
        .c1 { width: 60px; height: 50px; left: 20px; top: 20px; transform: rotate(10deg); }
        .c2 { width: 70px; height: 60px; right: 20px; top: 15px; transform: rotate(-20deg); }
        .c3 { width: 55px; height: 55px; left: 110px; top: 10px; z-index: 1; }
        .c4 { width: 50px; height: 40px; left: 60px; bottom: 10px; background: #0a0a0a; }
        .c5 { width: 60px; height: 50px; right: 60px; bottom: 15px; }
        .c6 { width: 50px; height: 50px; left: 10px; top: 40px; transform: rotate(45deg); }
        .c7 { width: 55px; height: 45px; right: 10px; top: 40px; transform: rotate(-15deg); }
        .c8 { width: 65px; height: 55px; left: 40px; top: 10px; transform: rotate(-10deg); z-index: 2; }
        .c9 { width: 60px; height: 60px; right: 40px; top: 10px; transform: rotate(20deg); z-index: 2; }
        .c10 { width: 50px; height: 50px; left: 90px; top: 5px; z-index: 2; background: #220000; }
        .c11 { width: 55px; height: 45px; left: 140px; top: 15px; transform: rotate(30deg); z-index: 2; }
        .c12 { width: 45px; height: 45px; left: 100px; top: 35px; z-index: 2; }
        .c13 { width: 50px; height: 55px; right: 80px; top: 5px; transform: rotate(-40deg); z-index: 2; }

        @keyframes glow { 0% { background-color: #1a1a1a; box-shadow: inset 0 0 5px #500000; } 100% { background-color: #3e0a0a; box-shadow: inset 0 0 30px #ff3300; } }
        .fire-glow { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, rgba(200, 20, 0, 0.6) 0%, rgba(255,0,0,0) 70%); mix-blend-mode: screen; animation: flicker 0.15s infinite; pointer-events: none; z-index: 5; }
        @keyframes flicker { 0% { opacity: 0.7; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.02); } 100% { opacity: 0.8; transform: scale(0.98); } }

        /* 인두 커서 */
        #iron-cursor {
            position: absolute; pointer-events: none; width: 200px; height: 40px; z-index: 9999;
            transform-origin: left center; transform: translate(0px, -20px) rotate(30deg);
            display: flex; align-items: center; filter: drop-shadow(5px 5px 5px rgba(0,0,0,0.3));
            left: 0; top: 0; visibility: hidden; 
        }
        .iron-head { width: 60px; height: 45px; background: #444; clip-path: polygon(0 50%, 100% 0, 100% 100%); transition: background 0.5s ease; }
        .iron-rod { width: 100px; height: 8px; background: #333; margin-left: -1px; transition: background 0.5s ease; }
        .iron-handle { width: 80px; height: 28px; background: #8b4513; border-radius: 5px 20px 20px 5px; box-shadow: inset 0 -5px 10px rgba(0,0,0,0.5); border-left: 5px solid #222; }
        #iron-cursor.heated .iron-head { background: #ff2400; filter: drop-shadow(0 0 10px #ff4500); }
        #iron-cursor.heated .iron-rod { background: linear-gradient(90deg, #ff2400 0%, #cc3300 30%, #333 70%); }

        /* =========================================
           죄인 캐릭터
           ========================================= */
        #person-container {
            width: 200px; height: 320px; 
            position: relative; cursor: pointer;
            display: flex; justify-content: center; align-items: flex-end;
        }

        .person-group {
            position: absolute; bottom: 20px; width: 100%; height: 300px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            z-index: 5;
            animation: shiver 1s infinite; 
        }
        @keyframes shiver { 0% { transform: translateX(0); } 25% { transform: translateX(1px); } 75% { transform: translateX(-1px); } 100% { transform: translateX(0); } }
        /* 고통 받을 때 미친듯이 떨림 */
        @keyframes shiver-violent { 0% { transform: translate(0, 0); } 25% { transform: translate(3px, 3px); } 50% { transform: translate(-3px, -3px); } 75% { transform: translate(3px, -3px); } 100% { transform: translate(0, 0); } }

        .person-group.pain {
            animation: shiver-violent 0.08s infinite !important;
        }

        /* 다리 & 몸통 */
        .legs { position: absolute; bottom: 0; width: 110px; height: 110px; display: flex; justify-content: space-between; z-index: 5; }
        .thigh { width: 50px; height: 100px; background: #e8e8e8; border-radius: 10px 10px 20px 20px; box-shadow: inset 2px -5px 10px rgba(0,0,0,0.1); position: relative; }
        .socks { position: absolute; bottom: 15px; width: 100%; height: 20px; background: #fff; border-radius: 5px; }
        .shoes { position: absolute; bottom: -5px; width: 48px; height: 22px; background: #d2b48c; border-radius: 20px 20px 10px 10px; border-bottom: 3px solid #8b4513; left: 1px; z-index: 2; }

        .torso { width: 120px; height: 120px; background: #f0f0f0; border-radius: 30px 30px 10px 10px; position: relative; bottom: 70px; z-index: 6; box-shadow: inset -5px 0 10px rgba(0,0,0,0.05); display: flex; justify-content: center; }
        .collar-left { position: absolute; top: 10px; width: 65px; height: 55px; border-top: 10px solid #e0e0e0; transform: rotate(45deg); left: 10px; }
        .collar-right { position: absolute; top: 10px; width: 65px; height: 55px; border-top: 10px solid #d0d0d0; transform: rotate(-45deg); right: 10px; }
        
        .rope { position: absolute; width: 100%; height: 100%; z-index: 7; }
        .rope-strand { position: absolute; background: #8b5a2b; border-radius: 5px; }
        .rs1 { width: 110px; height: 8px; top: 40px; left: 5px; transform: rotate(5deg); }
        .rs2 { width: 110px; height: 8px; top: 60px; left: 5px; transform: rotate(-5deg); }
        .rs3 { width: 8px; height: 60px; top: 30px; left: 30px; }
        .rs4 { width: 8px; height: 60px; top: 30px; right: 30px; }

        /* 머리 */
        .head { 
            width: 74px; height: 90px; background: #e8c39e;
            border-radius: 35px 35px 45px 45px; 
            position: relative; bottom: 60px; z-index: 7; 
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.1), 0 5px 10px rgba(0,0,0,0.1);
            border: 2px solid #c6a37e;
            transition: transform 0.1s;
        }
        .person-group.pain .head { transform: scale(0.95); }

        .topknot { width: 24px; height: 28px; background: #2a2a2a; border-radius: 10px; position: absolute; top: -20px; left: 50%; transform: translateX(-50%) rotate(-10deg); z-index: 4; }
        .hair-messy { position: absolute; width: 80px; height: 30px; top: -10px; left: -3px; background: #2a2a2a; border-radius: 50% 50% 0 0; z-index: 3; }

        /* --- 이목구비 --- */
        .eyebrows { position: absolute; top: 30px; width: 50px; height: 5px; display: flex; justify-content: space-between; left: 50%; transform: translateX(-50%); transition: all 0.1s; }
        .eyebrow { width: 18px; height: 5px; background: #333; border-radius: 2px; transition: all 0.1s; }
        .eb-left { transform: rotate(20deg); } 
        .eb-right { transform: rotate(-20deg); }
        
        .person-group.pain .eyebrows { top: 35px; width: 45px; }
        .person-group.pain .eb-left { transform: rotate(40deg); }
        .person-group.pain .eb-right { transform: rotate(-40deg); }

        /* 눈 */
        .eyes { position: absolute; top: 44px; width: 48px; height: 12px; display: flex; justify-content: space-between; left: 50%; transform: translateX(-50%); }
        .eye { 
            width: 14px; height: 6px; background: transparent; 
            border-top: 3px solid #333; border-radius: 50% 50% 0 0; 
            position: relative; transition: all 0.1s; 
        }

        /* 고통 시 눈 (확실한 > < 모양) */
        .person-group.pain .eye {
            border-radius: 0; border: none; width: 10px; height: 10px; background: transparent;
            border-top: 4px solid #222; border-right: 4px solid #222; margin-top: -2px;
        }
        .person-group.pain .eye.left { transform: rotate(45deg); } 
        .person-group.pain .eye.right { border-right: none; border-left: 4px solid #222; transform: rotate(-45deg); }
        
        .nose { position: absolute; top: 52px; width: 8px; height: 12px; background: #c6a37e; border-radius: 5px; left: 50%; transform: translateX(-50%); }

        .mouth { 
            position: absolute; top: 72px; width: 18px; height: 5px; 
            border-top: 3px solid #333; border-radius: 50%; 
            left: 50%; transform: translateX(-50%); 
            transition: all 0.1s; 
        }

        .person-group.pain .mouth {
            top: 65px; width: 26px; height: 22px;
            background: #4a2c2c; border: 2px solid #333; border-radius: 40% 40% 50% 50%; box-shadow: inset 0 -6px 0 #d15c5c;
        }

        /* =========================================
           [수정] 말풍선 디자인 (깔끔한 타원형 + 위치 수정)
           ========================================= */
        #answer-bubble {
            visibility: hidden; 
            position: absolute; 
            /* 캐릭터 머리 바로 위에 위치하도록 조정 */
            bottom: 100%; left: 50%; transform: translateX(-50%);
            margin-bottom: 30px; /* 머리와의 간격 */
            
            background: white; 
            padding: 15px 20px; 
            width: 220px; 
            max-height: 150px; 
            text-align: center;
            
            /* 둥근 사각형/타원 형태 */
            border-radius: 30px;
            border: 3px solid #333; 
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            
            font-size: 16px; font-weight: bold; line-height: 1.4; 
            z-index: 100; pointer-events: none;
        }

        /* 말풍선 꼬리 (테두리) */
        #answer-bubble::before { 
            content: ''; position: absolute; 
            bottom: -24px; left: 50%; 
            transform: translateX(-50%);
            border-style: solid; 
            border-width: 24px 12px 0; /* 아래로 뾰족한 삼각형 */
            border-color: #333 transparent transparent transparent; 
        }

        /* 말풍선 꼬리 (내부 흰색 - 테두리 덮기용) */
        #answer-bubble::after { 
            content: ''; position: absolute; 
            bottom: -18px; left: 50%; 
            transform: translateX(-50%);
            border-style: solid; 
            border-width: 20px 10px 0; 
            border-color: white transparent transparent transparent; 
        }
    </style>
</head>
<body>

    <div class="geegle-logo-container">
        <img src="logo.png" alt="기글(Geegle) 로고" class="geegle-logo-img">
    </div>

    <div id="iron-cursor">
        <div class="iron-head"></div>
        <div class="iron-rod"></div>
        <div class="iron-handle"></div>
    </div>

    <div class="layout-row">
        <div class="item-wrapper">
            <div id="fire-pit-container">
                <div class="pot-rim">
                    <div class="fire-glow"></div>
                    <div class="coal c1"></div> <div class="coal c2"></div> <div class="coal c3"></div> <div class="coal c4"></div> <div class="coal c5"></div>
                    <div class="coal c6"></div> <div class="coal c7"></div> <div class="coal c8"></div> <div class="coal c9"></div> <div class="coal c10"></div>
                    <div class="coal c11"></div> <div class="coal c12"></div> <div class="coal c13"></div> <div class="coal c14"></div> <div class="coal c15"></div>
                </div>
                <div class="earthen-pot"></div>
            </div>
        </div>

        <div class="item-wrapper">
            <div id="person-container">
                <div id="answer-bubble"></div>

                <div class="person-group" id="sinner-group">
                    <div class="head">
                        <div class="hair-messy"></div>
                        <div class="topknot"></div>
                        <div class="eyebrows">
                            <div class="eyebrow eb-left"></div><div class="eyebrow eb-right"></div>
                        </div>
                        <div class="eyes">
                            <div class="eye left"></div><div class="eye right"></div>
                        </div>
                        <div class="nose"></div>
                        <div class="mouth" id="sinner-mouth"></div>
                    </div>
                    <div class="torso">
                        <div class="collar-right"></div>
                        <div class="collar-left"></div>
                        <div class="rope">
                            <div class="rope-strand rs1"></div>
                            <div class="rope-strand rs2"></div>
                            <div class="rope-strand rs3"></div>
                            <div class="rope-strand rs4"></div>
                        </div>
                    </div>
                    <div class="legs">
                        <div class="thigh"><div class="shoes"></div></div>
                        <div class="thigh"><div class="shoes"></div></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div style="margin-bottom: 50px;">
        <input type="text" id="question-input" placeholder="무엇을 알고 싶으냐?" style="padding:15px; width:300px; max-width: 80%; font-family:'Gungsuh'; font-size:16px; border: 3px solid #333; border-radius: 10px; background:#fff;">
    </div>

    <script>
        const cursor = document.getElementById('iron-cursor');
        const firePit = document.getElementById('fire-pit-container');
        const person = document.getElementById('person-container');
        const answerBubble = document.getElementById('answer-bubble');
        const questionInput = document.getElementById('question-input');
        const sinnerGroup = document.getElementById('sinner-group');

        let isHeated = false;

        const randomAnswers = [
            "으악!! 제.. 제가 그랬습니다요!!",
            "억울합니다!! 저잣거리 김씨가 범인이라니까요!",
            "그건.. 옆집 개똥이가 알지도 모릅니다.. 으윽!",
            "아이고 나 죽네!! 살려만 주시면 다 불겠습니다!!",
            "사실.. 제가 곶감 하나 훔쳐 먹긴 했습니다..!!",
            "그건 관아에 가서 물어보셔야지요! 아악!",
            "뜨거워!! 제발 그 인두 좀 치워주십시오!!",
            "저는 그저 시키는 대로 했을 뿐입니다요! ㅠㅠ",
            "배가 고파서 정신이.. 으아악!!",
            "기억이 날 듯 말 듯 합니다... 한 번만 봐주십시오!"
        ];

        function moveIron(x, y) {
            if(cursor.style.visibility !== 'visible') {
                cursor.style.visibility = 'visible';
            }
            cursor.style.left = (x - 10) + 'px'; 
            cursor.style.top = (y - 10) + 'px';
            checkHeatCollision(x, y);
        }

        function checkHeatCollision(x, y) {
            const rect = firePit.getBoundingClientRect();
            const absoluteTop = rect.top + window.scrollY;
            const absoluteLeft = rect.left + window.scrollX;
            const absoluteBottom = absoluteTop + rect.height;
            const absoluteRight = absoluteLeft + rect.width;

            if (x >= absoluteLeft && x <= absoluteRight && y >= absoluteTop && y <= absoluteBottom) {
                if (!isHeated) {
                    isHeated = true;
                    cursor.classList.add('heated');
                }
            }
        }

        document.addEventListener('mousemove', (e) => { moveIron(e.pageX, e.pageY); });
        firePit.addEventListener('mouseenter', () => { isHeated = true; cursor.classList.add('heated'); });

        document.addEventListener('touchmove', (e) => {
            if(e.target.closest('#answer-bubble') || e.target.closest('#question-input')) return;
            const touch = e.touches[0];
            moveIron(touch.pageX, touch.pageY);
        }, { passive: false });

        document.addEventListener('touchstart', (e) => {
            if(e.target.closest('#question-input')) return;
            const touch = e.touches[0];
            moveIron(touch.pageX, touch.pageY);
        }, { passive: false });

        person.addEventListener('click', (e) => {
            const question = questionInput.value;
            
            if (!isHeated) {
                alert("인두가 식었소! 화로에 대고 달궈오시오!");
                return;
            }
            if (!question) {
                alert("질문도 없이 지지면 어떡하오!");
                questionInput.focus();
                return;
            }

            sinnerGroup.classList.add('pain');

            answerBubble.style.visibility = 'visible';
            answerBubble.innerText = "으아아악!!!";
            
            setTimeout(() => {
                const pick = randomAnswers[Math.floor(Math.random() * randomAnswers.length)];
                answerBubble.innerText = pick;
                
                // 0.5초 후 표정 및 상태 원상복구
                setTimeout(() => { 
                    sinnerGroup.classList.remove('pain');
                }, 500);
            }, 300);

            isHeated = false;
            cursor.classList.remove('heated');
        });
    </script>
</body>
</html>
