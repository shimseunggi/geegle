<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Geegle</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ========== 커스텀 인두 커서 ========== -->
  <div id="iron-cursor" aria-hidden="true">
    <div class="iron-head"></div>
    <div class="iron-rod"></div>
    <div class="iron-handle"></div>
  </div>

  <!-- ========== 상단 바(구글식) ========== -->
  <div class="top-bar">
    <button id="btn-open-settings" class="top-btn" type="button" aria-label="설정 열기">≡</button>

    <div class="top-right">
      <div class="app-dots" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
      <div class="avatar" aria-hidden="true"></div>
    </div>
  </div>

  <!-- ========== 설정 모달: 상소문 UI ========== -->
  <div id="settings-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-scroll" role="dialog" aria-modal="true" aria-label="상소문 설정">
      <div class="scroll-header">
        <div class="scroll-title">상 소 문</div>
        <button id="btn-close-settings" class="scroll-close" type="button" aria-label="닫기">✕</button>
      </div>

      <div class="scroll-body">
        <p class="scroll-line">전하! 통촉하여 주시옵소서.</p>
        <p class="scroll-line">보이는 것을 편의대로 하소서.</p>

        <div class="scroll-section">
          <div class="scroll-section-title">주야(晝夜) 설정</div>
          <div class="theme-row">
            <button id="btn-auto" class="theme-btn active" type="button">천리(순리)</button>
            <button id="btn-light" class="theme-btn" type="button">백주</button>
            <button id="btn-dark" class="theme-btn" type="button">야밤</button>
          </div>
        </div>
      </div>

      <div class="scroll-footer">
        <button id="btn-close-settings-2" class="scroll-action" type="button">거두어 주시옵소서 (닫기)</button>
      </div>
    </div>
  </div>

  <!-- ========== 메인 레이아웃 ========== -->
  <main class="center-wrap">

    <!-- 로고 -->
    <div class="logo-area" aria-label="지글 로고">
      <div class="logo">
        <span class="g1">지</span>
        <span class="g2">글</span>
        <span class="g3">ㄹ</span>
      </div>

      <div id="brand-iron" class="brand-iron" aria-hidden="true">
        <div class="brand-iron-head"></div>
        <div class="brand-iron-rod"></div>
        <div class="brand-iron-handle"></div>
      </div>
    </div>

    <!-- 검색 영역 -->
    <div class="search-box">
      <div class="search-inner">
        <div class="icon-search" aria-hidden="true">🔍</div>

        <input
          id="question-input"
          class="search-input"
          type="text"
          placeholder="지글 검색"
          autocomplete="off"
          spellcheck="false"
        />

        <button class="clear-btn" type="button" aria-label="입력 지우기">✕</button>
      </div>
    </div>

    <!-- 버튼들 -->
    <div class="btn-row">
      <button class="search-btn" id="btn-geegle-search" type="button">지글 검색</button>
      <button class="search-btn" id="btn-feeling-lucky" type="button" aria-label="사용법(10초) 열기">설명</button>
    </div>

    <!-- ========== 인터랙션 스테이지 ========== -->
    <section class="stage" aria-label="지글 인터랙션 스테이지">

      <!-- 화로(숯불) -->
      <div id="fire-pit-container" class="fire-pit-container" aria-label="숯불 화로">
        <div class="fire-pit">
          <div class="coal c1"></div>
          <div class="coal c2"></div>
          <div class="coal c3"></div>
          <div class="ember e1"></div>
          <div class="ember e2"></div>
          <div class="ember e3"></div>
        </div>
        <div class="fire-caption">숯불</div>
      </div>

      <!-- 열 게이지(항아리) -->
      <div id="heat-gauge" class="heat-gauge" aria-hidden="true">
        <div class="heat-jar" aria-hidden="true"></div>
        <div id="heat-gauge-num" class="heat-gauge-num">5</div>
      </div>

      <!-- 사람(죄인) -->
      <div id="person-container" class="person-container" aria-label="죄인">
        <div id="answer-bubble" class="answer-bubble" role="status" aria-live="polite"></div>

        <div id="sinner-group" class="sinner-group" aria-hidden="true">
          <div class="head"></div>
          <div class="torso"></div>
          <div class="thigh"></div>
        </div>
        <div class="person-caption">사람</div>
      </div>

    </section>

  </main>

  <!-- ========== 하단: 지글 버튼 ========== -->
  <div id="geegle-footer" class="geegle-footer">
    <button id="btn-geegle-footer" class="geegle-footer-btn" type="button">지글</button>
  </div>

  <!-- ========== (기존) 지글 소개 모달 ========== -->
  <div id="about-overlay" class="about-overlay" aria-hidden="true">
    <div class="about-card" role="dialog" aria-modal="true" aria-label="지글 설명">
      <div class="about-title">지글 설명</div>
      <textarea id="about-text" class="about-text" placeholder="여기에 지글에 대한 설명을 적을 수 있습니다."></textarea>
      <div class="about-actions">
        <button id="about-cancel" class="about-btn" type="button">닫기</button>
        <button id="about-save" class="about-btn primary" type="button">저장</button>
      </div>
    </div>
  </div>

  <!-- ========== (B안) 튜토리얼 코치마크 ========== -->
  <div id="tutorial-overlay" class="tutorial-overlay" aria-hidden="true">
    <!-- spotlight target highlight -->
    <div id="tutorial-spotlight" class="tutorial-spotlight" aria-hidden="true"></div>

    <!-- Google-ish coachmark popover -->
    <div id="tutorial-popover" class="tutorial-popover" role="dialog" aria-modal="true" aria-label="지글 사용법(10초)">
      <div class="tutorial-popover-header">
        <div id="tutorial-step-label" class="tutorial-kicker">팁 1/3</div>
        <button id="tutorial-close" class="tutorial-x" type="button" aria-label="닫기">✕</button>
      </div>

      <div id="tutorial-step-title" class="tutorial-popover-title">하문을 적으시오</div>
      <div id="tutorial-step-desc" class="tutorial-popover-desc">
        검색창에 질문을 적고 “지글 검색”을 누르시오.
      </div>

      <div class="tutorial-popover-footer">
        <div class="tutorial-dots" aria-hidden="true">
          <span class="dot" data-i="0"></span>
          <span class="dot" data-i="1"></span>
          <span class="dot" data-i="2"></span>
        </div>

        <div class="tutorial-actions">
          <button id="tutorial-skip" class="tut-btn" type="button">건너뛰기</button>
          <div class="tutorial-actions-right">
            <button id="tutorial-prev" class="tut-btn" type="button">이전</button>
            <button id="tutorial-next" class="tut-btn tut-btn-primary" type="button">다음</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ A버전: JS 분리 -->
  <script src="app.js"></script>

  <script>
    // 보조: 설정 모달 하단 닫기 버튼이 별도 id로 존재할 수 있어 처리
    (function () {
      const btn = document.getElementById('btn-close-settings-2');
      const modal = document.getElementById('settings-modal');
      if (btn && modal) {
        btn.addEventListener('click', () => {
          modal.classList.remove('open');
          modal.setAttribute('aria-hidden', 'true');
          document.body.classList.remove('settings-active');
        });
      }
    })();
  </script>

</body>
</html>
