<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Geegle</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- ✅ A버전: CSS 분리 -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <!-- 설정 버튼 -->
  <div class="settings-btn-container">
    <button id="btn-open-settings" class="g-icon-btn" aria-label="설정 열기" title="설정">
  <!-- ✅ Google-ish “앱(9점)” 아이콘 -->
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="7"  cy="7"  r="1.35" fill="currentColor"/>
    <circle cx="12" cy="7"  r="1.35" fill="currentColor"/>
    <circle cx="17" cy="7"  r="1.35" fill="currentColor"/>

    <circle cx="7"  cy="12" r="1.35" fill="currentColor"/>
    <circle cx="12" cy="12" r="1.35" fill="currentColor"/>
    <circle cx="17" cy="12" r="1.35" fill="currentColor"/>

    <circle cx="7"  cy="17" r="1.35" fill="currentColor"/>
    <circle cx="12" cy="17" r="1.35" fill="currentColor"/>
    <circle cx="17" cy="17" r="1.35" fill="currentColor"/>
  </svg>
</button>

  </div>

  <!-- 설정 모달 -->
  <div id="settings-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-scroll" role="dialog" aria-modal="true" aria-label="상소문 설정">
      <div class="scroll-roller-top"></div>
      <div class="modal-content">
        <div class="modal-title">상 소 문</div>
        <div class="modal-desc">
          전하! 통촉하여 주시옵소서.<br>
          보이는 것을 편의대로 하소서.
        </div>

        <div class="setting-section">
          <span class="setting-label">주야(晝夜) 설정</span>
          <div class="theme-options">
            <button class="theme-btn active" id="btn-auto">천리(순리)</button>
            <button class="theme-btn" id="btn-light">백주</button>
            <button class="theme-btn" id="btn-dark">야밤</button>
          </div>
        </div>

        <button id="btn-close-settings">거두어 주시옵소서 (닫기)</button>
      </div>
      <div class="scroll-roller-bottom"></div>
    </div>
  </div>

  <!-- 로고 (✅ 예전 “구글 느낌” SVG 유지) -->
  <div class="geegle-logo-container">
    <div class="geegle-logo-stack" aria-label="지글(Geegle) 로고">
      <!-- ✅ 로고 + 인두를 한 줄에 묶는 래퍼 -->
    <div class="geegle-lockup">
      <svg class="geegle-logo-svg" aria-label="Geegle" role="img" viewBox="0 0 272 92" xmlns="http://www.w3.org/2000/svg">
        <!-- (기존 로고 path 그대로) -->
        <path d="M35.29 41.41V32H67c.31 1.64.47 3.58.47 5.68 0 7.06-1.93 15.79-8.15 22.01-6.05 6.3-13.78 9.66-24.02 9.66C16.32 69.35.36 53.89.36 34.91.36 15.93 16.32.47 35.3.47c10.5 0 17.98 4.12 23.6 9.49l-6.64 6.64c-4.03-3.78-9.49-6.72-16.97-6.72-13.86 0-24.7 11.17-24.7 25.03 0 13.86 10.84 25.03 24.7 25.03 8.99 0 14.11-3.61 17.39-6.89 2.66-2.66 4.41-6.46 5.1-11.65l-22.49.01z" fill="#4285F4"/>
        <g transform="translate(-156 0)">
          <path d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z" fill="#EA4335"/>
        </g>
        <g transform="translate(-108 0)">
          <path d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z" fill="#FBBC05"/>
        </g>
        <path d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.61h9.25zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z" fill="#4285F4"/>
        <path d="M225 3v65h-9.5V3h9.5z" fill="#34A853"/>
        <path d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z" fill="#EA4335"/>
      </svg>

      <!-- ✅ 로고 옆(작은) 인두: 처음엔 차가운 상태(heated 클래스 없음) -->
      <div id="brand-iron" class="brand-iron" aria-hidden="true">
        <div class="iron-head"></div>
        <div class="iron-rod"></div>
        <div class="iron-handle"></div>
      </div>
    </div>
  </div>
</div>

  <!-- 검색 UI -->
  <div class="search-area">
    <div class="search-box" role="search" aria-label="지글 검색">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2"/>
          <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>

      <input id="question-input" type="text" placeholder="무엇을 알고 싶으냐?" autocomplete="off" />
      <button class="clear-btn" type="button" aria-label="입력 지우기">✕</button>
    </div>

    <div class="search-actions">
      <button class="search-btn" id="btn-geegle-search" type="button">지글 검색</button>
      <button class="search-btn" id="btn-feeling-lucky" type="button">운명에 맡기기</button>
    </div>
  </div>

  <!-- 인두 커서 -->
  <div id="iron-cursor" aria-hidden="true">
    <div class="iron-head"></div>
    <div class="iron-rod"></div>
    <div class="iron-handle"></div>
  </div>

  <!-- 메인(화로 + 죄인) -->
  <div class="layout-row">
    <div class="item-wrapper">
      <div id="fire-pit-container" aria-label="화로">
        <!-- ✅ 항아리 카운트(5 → 1) : 숫자 1개만 표시 -->
<div id="heat-gauge" class="heat-gauge" aria-hidden="true">
  <div id="heat-gauge-num" class="heat-gauge-num">5</div>
</div>


        <div class="pot-rim">
          <div class="fire-glow"></div>
          <div class="coal c1"></div><div class="coal c2"></div><div class="coal c3"></div><div class="coal c4"></div><div class="coal c5"></div>
          <div class="coal c6"></div><div class="coal c7"></div><div class="coal c8"></div><div class="coal c9"></div><div class="coal c10"></div>
          <div class="coal c11"></div><div class="coal c12"></div><div class="coal c13"></div>
        </div>
        <div class="earthen-pot"></div>
      </div>
    </div>

    <div class="item-wrapper">
      <div id="person-container" aria-label="죄인">
        <div id="answer-bubble"></div>

        <div class="person-group" id="sinner-group">
          <div class="head">
            <div class="hair-messy"></div>
            <div class="topknot"></div>
            <div class="eyebrows">
              <div class="eyebrow eb-left"></div><div class="eyebrow eb-right"></div>
            </div>
            <div class="eyes">
              <div class="eye left"></div><div class="eye right"></div>
            </div>
            <div class="nose"></div>
            <div class="mouth"></div>
          </div>

          <div class="torso">
            <div class="collar-inner"></div>
            <div class="collar-outer"></div>
            <div class="rope-container">
              <div class="rope-strand rope-cross-1"></div>
              <div class="rope-strand rope-cross-2"></div>
              <div class="rope-strand rope-waist"></div>
            </div>
          </div>

          <div class="legs">
            <div class="thigh"><div class="shoes"></div></div>
            <div class="thigh"><div class="shoes"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- footer -->
  <footer class="g-footer" aria-label="하단 정보">
    <div class="g-footer-country">
      <button id="btn-geegle-footer" class="g-footer-link" type="button" aria-label="지글 설명 편집 열기">
        지글
      </button>
    </div>
  </footer>

  <!-- 지글 설명 모달 -->
  <div id="about-overlay" class="about-overlay" aria-hidden="true">
    <div class="about-card" role="dialog" aria-modal="true" aria-label="지글 설명 편집">
      <div class="about-title">지글 설명</div>
      <textarea id="about-text" class="about-textarea" placeholder="지글이 무엇인지 한 줄(또는 여러 줄)로 적어주세요."></textarea>
      <div class="about-actions">
        <button id="about-cancel" class="about-btn" type="button">닫기</button>
        <button id="about-save" class="about-btn" type="button">저장</button>
      </div>
    </div>
  </div>

  <!-- ✅ A버전: JS 분리 -->
  <script src="./app.js" defer></script>
</body>
</html>
