<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Geegle</title>

  <link rel="apple-touch-icon" href="assets/img/icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <script defer src="assets/js/app.js"></script>
</head>

<body>
  <!-- 설정 버튼 -->
  <div class="settings-btn-container">
    <button id="btn-open-settings" aria-label="설정 열기">
      <div class="gear">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="gear-inner"></div>
        <div class="gear-hole"></div>
      </div>
    </button>
  </div>

  <!-- 설정 모달 -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-scroll">
      <div class="scroll-roller-top"></div>
      <div class="modal-content">
        <div class="modal-title">상 소 문</div>
        <div class="modal-desc">
          전하! 통촉하여 주시옵소서.<br />
          보이는 것을 편의대로 하소서.
        </div>

        <div class="setting-section">
          <span class="setting-label">주야(晝夜) 설정</span>
          <div class="theme-options">
            <button class="theme-btn active" id="btn-auto">천리(순리)</button>
            <button class="theme-btn" id="btn-light">백주</button>
            <button class="theme-btn" id="btn-dark">야밤</button>
          </div>
        </div>

        <button id="btn-close-settings">거두어 주시옵소서 (닫기)</button>
      </div>
      <div class="scroll-roller-bottom"></div>
    </div>
  </div>

  <!-- 로고 -->
  <div class="geegle-logo-container">
    <img src="assets/img/logo.png" alt="지글(Geegle) 로고" class="geegle-logo-img" />
  </div>

  <!-- 구글풍 검색 UI -->
  <div class="search-area">
    <div class="search-box" role="search" aria-label="지글 검색">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        type="text"
        id="question-input"
        placeholder="무엇을 알고 싶으냐?"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="clear-btn" type="button" aria-label="입력 지우기">✕</button>
    </div>

    <div class="search-actions" aria-label="검색 버튼">
      <button type="button" class="search-btn" id="btn-geegle-search">지글 검색</button>
      <button type="button" class="search-btn ghost" id="btn-feeling-lucky">운명에 맡기기</button>
    </div>
  </div>

  <!-- 인두 커서 -->
  <div id="iron-cursor">
    <div class="iron-head"></div>
    <div class="iron-rod"></div>
    <div class="iron-handle"></div>
  </div>

  <!-- 메인 인터랙션 영역 -->
  <div class="layout-row">
    <!-- 화로 -->
    <div class="item-wrapper">
      <div id="fire-pit-container">
        <div class="pot-rim">
          <div class="fire-glow"></div>
          <div class="coal c1"></div> <div class="coal c2"></div> <div class="coal c3"></div> <div class="coal c4"></div> <div class="coal c5"></div>
          <div class="coal c6"></div> <div class="coal c7"></div> <div class="coal c8"></div> <div class="coal c9"></div> <div class="coal c10"></div>
          <div class="coal c11"></div> <div class="coal c12"></div> <div class="coal c13"></div> <div class="coal c14"></div> <div class="coal c15"></div>
        </div>
        <div class="earthen-pot"></div>
      </div>
    </div>

    <!-- 죄인 -->
    <div class="item-wrapper">
      <div id="person-container">
        <div id="answer-bubble"></div>

        <div class="person-group" id="sinner-group">
          <div class="head">
            <div class="hair-messy"></div>
            <div class="topknot"></div>
            <div class="eyebrows">
              <div class="eyebrow eb-left"></div><div class="eyebrow eb-right"></div>
            </div>
            <div class="eyes">
              <div class="eye left"></div><div class="eye right"></div>
            </div>
            <div class="nose"></div>
            <div class="mouth" id="sinner-mouth"></div>
          </div>

          <div class="torso">
            <div class="collar-inner"></div>
            <div class="collar-outer"></div>
            <div class="rope-container">
              <div class="rope-strand rope-cross-1"></div>
              <div class="rope-strand rope-cross-2"></div>
              <div class="rope-strand rope-waist"></div>
            </div>
          </div>

          <div class="legs">
            <div class="thigh"><div class="shoes"></div></div>
            <div class="thigh"><div class="shoes"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
